<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站备案中 — 钓遇 WeFish</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="./assets/images/logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF6B35;
      --blue:   #2196F3;
      --bg:     #0A0F1E;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }

    /* ── 背景渐变光晕 ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 30% 40%, rgba(255,107,53,.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 70% 60%, rgba(33,150,243,.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 0 0 3px rgba(255,107,53,.35);
      margin-bottom: 28px;
      animation: float 3.6s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0);   }
      50%      { transform: translateY(-8px); }
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 700;
      background: linear-gradient(90deg, var(--orange), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: rgba(255,255,255,.6);
      max-width: 420px;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    /* ── 状态卡片 ── */
    .card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 28px 36px;
      max-width: 460px;
      width: 100%;
      backdrop-filter: blur(12px);
      margin-bottom: 36px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .status-row:last-child { border-bottom: none; }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-yellow { background: #FFD700; box-shadow: 0 0 6px #FFD700; animation: pulse-y 1.6s ease-in-out infinite; }
    .dot-green  { background: #4CAF50; box-shadow: 0 0 6px #4CAF50; }
    .dot-orange { background: var(--orange); }

    @keyframes pulse-y {
      0%,100% { opacity: 1; }
      50%      { opacity: .35; }
    }

    .row-label { color: rgba(255,255,255,.5); font-size: .9rem; flex: 1; text-align: left; }
    .row-val   { color: rgba(255,255,255,.85); font-size: .9rem; font-weight: 500; }

    /* ── 底部文案 ── */
    .footer-note {
      color: rgba(255,255,255,.3);
      font-size: .82rem;
      line-height: 1.9;
      max-width: 380px;
    }
    .footer-note a {
      color: var(--orange);
      text-decoration: none;
    }
    .footer-note a:hover { text-decoration: underline; }

    /* ── 鱼尾装饰 ── */
    .fish-icon {
      font-size: 2rem;
      display: inline-block;
      animation: swim 2.8s ease-in-out infinite;
      margin-bottom: 8px;
    }
    @keyframes swim {
      0%,100% { transform: rotate(-6deg) translateX(0);   }
      50%      { transform: rotate( 6deg) translateX(6px); }
    }
  </style>
</head>
<body>
  <div class="fish-icon">🎣</div>
  <img src="./assets/images/logo.png" alt="钓遇 Logo" class="logo" onerror="this.style.display='none'" />

  <h1>网站备案审核中</h1>

  <p class="subtitle">
    根据工业和信息化部相关规定，网站正在进行 ICP 备案审核。<br>
    审核通过后将立即恢复访问，感谢您的耐心等待。
  </p>

  <div class="card">
    <div class="status-row">
      <span class="dot dot-yellow"></span>
      <span class="row-label">网站状态</span>
      <span class="row-val">暂停访问（备案中）</span>
    </div>
    <div class="status-row">
      <span class="dot dot-orange"></span>
      <span class="row-label">备案进度</span>
      <span class="row-val">ICP 备案审核中</span>
    </div>
    <div class="status-row">
      <span class="dot dot-green"></span>
      <span class="row-label">APP 状态</span>
      <span class="row-val">正常运行</span>
    </div>
    <div class="status-row">
      <span class="dot dot-green"></span>
      <span class="row-label">隐私政策 / 用户协议</span>
      <span class="row-val">
        <a href="./privacy.html" style="color:var(--orange);text-decoration:none;">仍可访问 →</a>
      </span>
    </div>
  </div>

  <p class="footer-note">
    钓遇 WeFish · dywefish.com<br>
    如有疑问请联系：
    <a href="mailto:support@dywefish.com">support@dywefish.com</a>
  </p>
</body>
</html>
